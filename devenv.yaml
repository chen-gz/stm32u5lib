inputs:
  mk-shell-bin:
    url: github:rrbutani/nix-mk-shell-bin
  nix2container:
    url: github:nlewo/nix2container
    inputs:
      nixpkgs:
        follows: nixpkgs
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling
  rust-overlay:
    url: github:oxalica/rust-overlay
    inputs:
      nixpkgs:
        follows: nixpkgs
  zig-overlay:
    url: github:mitchellh/zig-overlay
  zls:
    url: github:zigtools/zls
    inputs:
      nixpkgs:
        follows: nixpkgs
      zig-overlay:
        follows: zig-overlay
